<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="shoin-lang" content="__SHOIN_LANG__">
<!-- REQ-007: 3-pane Web UI (sources / chat / studio) -->
<title>Shoin 書院</title>
<!-- v0.2.666: stylesheet lives in /static/style.css (served by the
     same-origin route, CSP style-src self); the JS app lives in
     /static/app.js — no build step, three static files instead of one. -->
<link rel="stylesheet" href="/static/style.css">
<!-- user theme hook (v0.2.643): /api/theme.css serves ~/.config/shoin/theme.css
     verbatim — empty when absent. Last stylesheet wins, so :root variables
     here override every palette/theme value above. -->
<link rel="stylesheet" href="/api/theme.css">
</head>
<body>
<header>
  <span class="mark" aria-hidden="true">書院</span>
  <h1 id="nbTitle" data-i18n="app.title">Shoin</h1>
  <span class="lamp" id="lamp"><i></i><span id="lampText" data-i18n="app.lamp.off">LLM未接続</span></span>
  <button id="langBtn" type="button" aria-label="Switch language">EN</button>
</header>
<div id="banner" role="status"></div>
<div class="tabs" role="tablist">
  <button role="tab" id="tabSrc" aria-selected="false" aria-controls="paneSrc" data-pane="paneSrc" data-i18n="tabs.sources">資料</button>
  <button role="tab" id="tabChat" aria-selected="true" aria-controls="paneChat" data-pane="paneChat" data-i18n="tabs.chat">対話</button>
  <button role="tab" id="tabStudio" aria-selected="false" aria-controls="paneStudio" data-pane="paneStudio" data-i18n="tabs.studio">書斎</button>
</div>
<main>
  <!-- sources -->
  <section class="pane" id="paneSrc" role="tabpanel" aria-labelledby="tabSrc">
    <div class="pane-head"><span data-i18n="sources.head">書 棚</span><span id="srcSelInfo" class="selinfo"></span></div>
    <div class="pane-body">
      <ul id="nbList"></ul>
      <form id="nbForm" class="adders" autocomplete="off">
        <div class="row">
          <input id="nbName" class="field" data-i18n-ph="nb.placeholder" data-i18n-aria="a11y.nbname" aria-label="書院名" placeholder="新しい書院の名前" required>
          <button class="btn primary" type="submit" data-i18n="nb.create">作成</button>
        </div>
      </form>
      <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
      <div id="srcList"></div>
      <div id="srcEmpty" class="empty" hidden>
        <b data-i18n="sources.empty.title">書棚が空</b>
        <span data-i18n="sources.empty.body">ファイルかURLを加えると、引用付きで対話できる。</span>
      </div>
      <div class="adders" id="srcAdders" hidden>
        <div class="row">
          <input type="file" id="fileInput" class="field" accept=".txt,.md,.markdown,.html,.htm,.pdf" data-i18n-aria="a11y.upload" aria-label="Upload file">
        </div>
        <div class="row">
          <input id="urlInput" class="field" placeholder="https://…" data-i18n-aria="a11y.url" aria-label="URL">
          <button class="btn" id="urlBtn" type="button" data-i18n="sources.addurl">取込</button>
        </div>
      </div>
    </div>
  </section>

  <!-- chat -->
  <section class="pane active" id="paneChat" role="tabpanel" aria-labelledby="tabChat">
    <div class="pane-head"><span data-i18n="chat.head">文 机</span><span id="degBadge" class="badge warn" hidden data-i18n="chat.degraded">検索のみ</span><button class="clear-chat" id="clearChat" type="button" data-i18n="chat.clear" hidden>クリア</button></div>
    <div class="pane-body" id="chat" aria-live="polite"></div>
    <div id="chatEmpty" class="empty" style="margin:14px" hidden>
      <b data-i18n="chat.empty.title">問いから始まる</b>
      <span data-i18n="chat.empty.body">下の入力欄から、資料に基づく質問をどうぞ。</span>
    </div>
    <div id="composer">
      <div id="qs" data-i18n-aria="a11y.questions" aria-label="Suggested questions"></div>
      <form id="askForm">
        <input id="askInput" class="field" data-i18n-ph="chat.placeholder" data-i18n-title="chat.hint" data-i18n-aria="a11y.ask" aria-label="質問" placeholder="資料への質問…" title="ヒント: -語 で除外検索(例: Python -legacy)。/ で質問へ、1/2/3 でペイン切替" autocomplete="off">
        <button class="btn primary" id="askBtn" type="submit" data-i18n="chat.ask">尋ねる</button>
      </form>
    </div>
  </section>

  <!-- studio + notes -->
  <section class="pane" id="paneStudio" role="tabpanel" aria-labelledby="tabStudio">
    <div class="pane-head" data-i18n="studio.head">書 斎</div>
    <div class="pane-body">
      <div class="kinds" id="kinds"></div>
      <div id="studioOut"></div>
      <hr style="border:0;border-top:1px solid var(--border);margin:12px 0">
      <div class="pane-head" style="border:0;padding:0 0 8px" data-i18n="notes.head">ノ ー ト</div>
      <form class="note-form" id="noteForm">
        <input id="noteTitle" class="field" data-i18n-ph="notes.title" data-i18n-aria="a11y.notetitle" aria-label="題" placeholder="題" required>
        <textarea id="noteBody" class="field" rows="3" data-i18n-ph="notes.body" data-i18n-aria="a11y.notebody" aria-label="本文" placeholder="本文"></textarea>
        <button class="btn" type="submit" data-i18n="notes.save">ノートを保存</button>
      </form>
      <div id="noteList"></div>
      <hr style="border:0;border-top:1px solid var(--border);margin:12px 0">
      <div class="muted" data-i18n="export.head">エクスポート</div>
      <div class="exports">
        <a class="btn" id="exMd" download>Markdown</a>
        <a class="btn" id="exBib" download>BibTeX</a>
        <a class="btn" id="exRis" download>RIS</a>
      </div>
      <hr style="border:0;border-top:1px solid var(--border);margin:12px 0">
      <div class="muted" data-i18n="reindex.head">埋め込み</div>
      <button class="btn" id="reindexBtn" type="button" data-i18n="reindex.btn" data-i18n-title="reindex.hint" title="埋め込みモデル変更後に再構築する">埋め込みを再構築</button>
    </div>
  </section>
</main>

<div id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="sheet">
    <h2 id="viewerTitle"></h2>
    <div class="tx" id="viewerText"></div>
    <div class="ft"><button class="btn" id="viewerClose" data-i18n="viewer.close">閉じる</button></div>
  </div>
</div>
<div id="toast" class="toast" role="alert"></div>

<script src="/static/app.js"></script>
</body>
</html>
