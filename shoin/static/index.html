<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoin 書院</title>
<style>
:root{
  --washi:#F6F2E9; --paper:#FFFFFF; --sumi:#20242B; --sumi-soft:#5A6068;
  --seiji:#00C4CC; --seiji-ink:#00777D; --shu:#B3261E; --kohaku:#8A5A00;
  --matsu:#2C6E49; --border:#E2DCCB; --border-strong:#C9C2AE;
  --serif:"Hiragino Mincho ProN","Yu Mincho","BIZ UDMincho","Noto Serif CJK JP",Georgia,serif;
  --sans:system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK JP",sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
  --sp:4px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--washi);color:var(--sumi);font-size:15px;line-height:1.7}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seiji);outline-offset:2px;border-radius:2px}
a{color:var(--seiji-ink)}
@media (prefers-reduced-motion:no-preference){
  .msg,.toast{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}

/* ---- header: ink band ---- */
header{display:flex;align-items:center;gap:16px;background:var(--sumi);color:var(--washi);
  padding:0 16px;height:52px}
.mark{font-family:var(--serif);writing-mode:vertical-rl;font-size:13px;letter-spacing:.35em;
  line-height:1;border:1px solid var(--seiji);color:var(--seiji);padding:5px 3px;border-radius:2px}
header h1{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.06em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lamp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#C8C2B4}
.lamp i{width:9px;height:9px;border-radius:50%;background:#6A6F77}
.lamp.on i{background:var(--seiji)}
header button{background:none;border:1px solid #4A4F57;color:var(--washi);border-radius:3px;
  padding:3px 10px;font-size:12px;cursor:pointer}
header button:hover{border-color:var(--seiji)}

/* ---- layout ---- */
main{display:grid;grid-template-columns:264px 1fr 336px;height:calc(100% - 52px)}
.pane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border)}
.pane:last-child{border-right:0}
.pane-head{font-family:var(--serif);font-size:13px;letter-spacing:.18em;color:var(--sumi-soft);
  padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.pane-body{flex:1;overflow-y:auto;padding:12px 14px}
.tabs{display:none}
@media (max-width:880px){
  main{grid-template-columns:1fr}
  .pane{display:none;border-right:0}
  .pane.active{display:flex}
  .tabs{display:flex;border-bottom:1px solid var(--border);background:var(--paper)}
  .tabs button{flex:1;border:0;background:none;padding:10px;font-size:13px;cursor:pointer;
    color:var(--sumi-soft);border-bottom:2px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--sumi);border-bottom-color:var(--seiji)}
}

/* ---- shared bits ---- */
.btn{background:var(--paper);border:1px solid var(--border-strong);border-radius:3px;
  padding:5px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--seiji-ink)}
.btn.primary{background:var(--seiji);border-color:var(--seiji);color:#062A2C;font-weight:600}
.btn.danger{color:var(--shu)}
.field{width:100%;background:var(--paper);border:1px solid var(--border-strong);border-radius:3px;
  padding:7px 10px}
.muted{color:var(--sumi-soft);font-size:12.5px}
.empty{border:1px dashed var(--border-strong);border-radius:4px;padding:22px 16px;text-align:center;
  color:var(--sumi-soft);margin-top:8px}
.empty b{display:block;font-family:var(--serif);font-size:15px;color:var(--sumi);
  letter-spacing:.08em;margin-bottom:6px}
.badge{display:inline-block;font-size:11.5px;border-radius:2px;padding:1px 7px;margin-left:6px}
.badge.warn{background:#F4E8CE;color:var(--kohaku)}
.badge.err{background:#F6DEDC;color:var(--shu)}
.badge.dim{background:#EAE5D8;color:var(--sumi-soft)}

/* ---- seal chips (蔵書印) : the signature element ---- */
.seal{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;
  padding:0 4px;margin:0 2px;font-family:var(--mono);font-size:11.5px;font-weight:700;
  color:var(--seiji-ink);background:var(--paper);border:1.5px solid var(--seiji);
  border-radius:3px;cursor:pointer;vertical-align:text-bottom}
.seal:hover{background:var(--seiji);color:#062A2C}
.seal.bad{color:var(--shu);border-color:var(--shu);text-decoration:line-through}
.seal.bad:hover{background:var(--shu);color:#fff}
.seal.mis{color:var(--kohaku);border-color:var(--kohaku);border-style:dashed}
.seal.mis:hover{background:var(--kohaku);color:#fff}
.seal.ok{background:var(--seiji);color:#062A2C}

/* ---- sources pane ---- */
.src{display:flex;align-items:flex-start;gap:8px;padding:8px 6px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:3px}
.src:hover{background:var(--paper)}
.src .no{font-family:var(--mono);font-size:11px;color:var(--seiji-ink);border:1px solid var(--border-strong);border-radius:2px;padding:0 4px;margin-top:3px}
.src .t{flex:1;font-size:13.5px;word-break:break-all}
.src .k{font-size:11px;color:var(--sumi-soft)}
.src .src-act{border:0;background:none;color:var(--sumi-soft);cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0}
.src .src-act:hover{color:var(--shu)}
.src .src-rename{font-size:13px;width:100%;border:1px solid var(--border-strong);border-radius:2px;padding:1px 4px;background:var(--paper);color:var(--ink);outline:none}
.adders{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.adders .row{display:flex;gap:6px}
#nbList{list-style:none;padding:0}
#nbList li{display:flex;gap:6px;align-items:center;padding:6px 4px;border-radius:3px;cursor:pointer}
#nbList li:hover,#nbList li.cur{background:var(--paper)}
#nbList .name{flex:1;font-family:var(--serif);font-size:14.5px}
#nbList .c{font-size:11px;color:var(--sumi-soft)}
#nbList .ren{border:0;background:none;color:var(--sumi-soft);cursor:pointer;font-size:11px;padding:0 3px;opacity:0}
#nbList li:hover .ren,#nbList li.cur .ren{opacity:1}
#nbList .ren:hover{color:var(--seiji-ink)}
#nbList .del{color:var(--shu-soft,var(--shu))}
#nbList .del:hover{color:var(--shu)}

/* ---- chat pane ---- */
.pane-head .clear-chat{margin-left:auto;font-size:11px;border:1px solid var(--border-strong);
  background:none;border-radius:3px;padding:2px 8px;cursor:pointer;color:var(--sumi-soft)}
.pane-head .clear-chat:hover{color:var(--shu);border-color:var(--shu)}
#chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:72ch}
.msg .who{font-family:var(--serif);font-size:11.5px;letter-spacing:.2em;color:var(--sumi-soft);margin-bottom:3px}
.msg .body{background:var(--paper);border:1px solid var(--border);border-radius:4px;
  padding:10px 13px;white-space:pre-wrap;word-break:break-word}
.msg.user .body{background:transparent;border-color:var(--border-strong)}
.msg .cites{margin-top:6px;font-size:12px;color:var(--sumi-soft);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#composer{border-top:1px solid var(--border);padding:10px 14px;background:var(--washi)}
#qs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.q-chip{font-size:12px;border:1px solid var(--border-strong);background:var(--paper);
  border-radius:12px;padding:3px 11px;cursor:pointer}
.q-chip:hover{border-color:var(--seiji-ink);color:var(--seiji-ink)}
#askForm{display:flex;gap:8px}
#askInput{flex:1}
#banner{display:none;background:#EFE9DA;border-bottom:1px solid var(--border-strong);
  color:var(--kohaku);font-size:12.5px;padding:6px 14px}

/* ---- studio pane ---- */
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.note-form{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:10px}
.card h4{font-family:var(--serif);font-size:13.5px;letter-spacing:.1em;display:flex;align-items:center}
.card .bd{white-space:pre-wrap;font-size:13.5px;margin-top:6px;word-break:break-word}
.card .x{float:right;border:0;background:none;color:var(--sumi-soft);cursor:pointer}
.card .x:hover{color:var(--shu)}
.exports{display:flex;gap:6px;margin-top:4px}

/* ---- passage viewer / toast ---- */
#viewer{position:fixed;inset:0;background:rgba(32,36,43,.45);display:none;z-index:30}
#viewer.open{display:flex;align-items:center;justify-content:center;padding:24px}
#viewer .sheet{background:var(--paper);max-width:680px;width:100%;max-height:80vh;display:flex;
  flex-direction:column;border-radius:4px;border-top:3px solid var(--seiji)}
#viewer .sheet h3{font-family:var(--serif);padding:12px 16px;border-bottom:1px solid var(--border);font-size:15px}
#viewer .sheet .tx{overflow-y:auto;padding:14px 16px;font-size:13.5px}
#viewer .sheet .ft{padding:10px 16px;border-top:1px solid var(--border);text-align:right}
.excerpt-label{font-size:11px;letter-spacing:.06em;color:var(--sumi-soft);margin-bottom:5px}
.section-label{font-size:12px;color:var(--seiji-ink);font-family:var(--serif);margin-bottom:8px;
  word-break:break-word}
.excerpt{background:var(--washi);border-left:3px solid var(--seiji);padding:8px 12px;
  white-space:pre-wrap;word-break:break-word;font-size:13px;margin-bottom:8px}
details.full-src{margin-top:4px}
details.full-src summary{cursor:pointer;font-size:12px;color:var(--seiji);padding:4px 0;
  list-style:none;user-select:none}
details.full-src summary::before{content:"▸ "}
details.full-src[open] summary::before{content:"▾ "}
details.full-src .full-body{white-space:pre-wrap;word-break:break-word;
  border-top:1px solid var(--border);padding-top:10px;margin-top:6px;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:40;display:none;
  background:var(--sumi);color:var(--washi);border-left:3px solid var(--shu);
  border-radius:3px;padding:9px 16px;font-size:13px;max-width:88vw}
.spin{display:inline-block;font-family:var(--mono)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true">書院</span>
  <h1 id="nbTitle" data-i18n="app.title">Shoin</h1>
  <span class="lamp" id="lamp"><i></i><span id="lampText" data-i18n="app.lamp.off">LLM未接続</span></span>
  <button id="langBtn" type="button" aria-label="Switch language">EN</button>
</header>
<div id="banner" role="status"></div>
<div class="tabs" role="tablist">
  <button role="tab" aria-selected="false" data-pane="paneSrc" data-i18n="tabs.sources">資料</button>
  <button role="tab" aria-selected="true" data-pane="paneChat" data-i18n="tabs.chat">対話</button>
  <button role="tab" aria-selected="false" data-pane="paneStudio" data-i18n="tabs.studio">書斎</button>
</div>
<main>
  <!-- sources -->
  <section class="pane" id="paneSrc" data-i18n-aria="tabs.sources" aria-label="Sources">
    <div class="pane-head" data-i18n="sources.head">書 棚</div>
    <div class="pane-body">
      <ul id="nbList"></ul>
      <form id="nbForm" class="adders" autocomplete="off">
        <div class="row">
          <input id="nbName" class="field" data-i18n-ph="nb.placeholder" placeholder="新しい書院の名前" required>
          <button class="btn primary" type="submit" data-i18n="nb.create">作成</button>
        </div>
      </form>
      <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
      <div id="srcList"></div>
      <div id="srcEmpty" class="empty" hidden>
        <b data-i18n="sources.empty.title">書棚が空</b>
        <span data-i18n="sources.empty.body">ファイルかURLを加えると、引用付きで対話できる。</span>
      </div>
      <div class="adders" id="srcAdders" hidden>
        <div class="row">
          <input type="file" id="fileInput" class="field" accept=".txt,.md,.html,.pdf" data-i18n-aria="a11y.upload" aria-label="Upload file">
        </div>
        <div class="row">
          <input id="urlInput" class="field" placeholder="https://…" data-i18n-aria="a11y.url" aria-label="URL">
          <button class="btn" id="urlBtn" type="button" data-i18n="sources.addurl">取込</button>
        </div>
      </div>
    </div>
  </section>

  <!-- chat -->
  <section class="pane active" id="paneChat" data-i18n-aria="tabs.chat" aria-label="Chat">
    <div class="pane-head"><span data-i18n="chat.head">文 机</span><span id="degBadge" class="badge warn" hidden data-i18n="chat.degraded">検索のみ</span><button class="clear-chat" id="clearChat" type="button" data-i18n="chat.clear" hidden>クリア</button></div>
    <div class="pane-body" id="chat" aria-live="polite"></div>
    <div id="chatEmpty" class="empty" style="margin:14px" hidden>
      <b data-i18n="chat.empty.title">問いから始まる</b>
      <span data-i18n="chat.empty.body">下の入力欄から、資料に基づく質問をどうぞ。</span>
    </div>
    <div id="composer">
      <div id="qs" data-i18n-aria="a11y.questions" aria-label="Suggested questions"></div>
      <form id="askForm">
        <input id="askInput" class="field" data-i18n-ph="chat.placeholder" data-i18n-title="chat.hint" placeholder="資料への質問…" title="ヒント: -語 で除外検索(例: Python -legacy)" autocomplete="off">
        <button class="btn primary" id="askBtn" type="submit" data-i18n="chat.ask">尋ねる</button>
      </form>
    </div>
  </section>

  <!-- studio + notes -->
  <section class="pane" id="paneStudio" data-i18n-aria="tabs.studio" aria-label="Studio">
    <div class="pane-head" data-i18n="studio.head">書 斎</div>
    <div class="pane-body">
      <div class="kinds" id="kinds"></div>
      <div id="studioOut"></div>
      <hr style="border:0;border-top:1px solid var(--border);margin:12px 0">
      <div class="pane-head" style="border:0;padding:0 0 8px" data-i18n="notes.head">ノ ー ト</div>
      <form class="note-form" id="noteForm">
        <input id="noteTitle" class="field" data-i18n-ph="notes.title" placeholder="題" required>
        <textarea id="noteBody" class="field" rows="3" data-i18n-ph="notes.body" placeholder="本文"></textarea>
        <button class="btn" type="submit" data-i18n="notes.save">ノートを保存</button>
      </form>
      <div id="noteList"></div>
      <hr style="border:0;border-top:1px solid var(--border);margin:12px 0">
      <div class="muted" data-i18n="export.head">エクスポート</div>
      <div class="exports">
        <a class="btn" id="exMd" download>Markdown</a>
        <a class="btn" id="exBib" download>BibTeX</a>
        <a class="btn" id="exRis" download>RIS</a>
      </div>
      <hr style="border:0;border-top:1px solid var(--border);margin:12px 0">
      <div class="muted" data-i18n="reindex.head">埋め込み</div>
      <button class="btn" id="reindexBtn" type="button" data-i18n="reindex.btn" data-i18n-title="reindex.hint" title="埋め込みモデル変更後に再構築する">埋め込みを再構築</button>
    </div>
  </section>
</main>

<div id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="sheet">
    <h3 id="viewerTitle"></h3>
    <div class="tx" id="viewerText"></div>
    <div class="ft"><button class="btn" id="viewerClose" data-i18n="viewer.close">閉じる</button></div>
  </div>
</div>
<div id="toast" role="alert"></div>

// Enters inline-rename mode for a source row. Factored out of the dblclick
// handler so renderNotebook() can also call it to RESTORE an in-progress,
// uncommitted edit after a re-render — every unrelated write in the app
// (note add/delete, upload, studio generate, clear-chat, ...) calls
// openNotebook() on success, which used to unconditionally tear down and
// rebuild #srcList, silently discarding whatever the user was mid-typing in
// a rename input elsewhere on the page with no warning.
function startSourceRename(s, tt, row, prefillValue){
  const nb = cur;  // capture notebook reference; cur may drift if user switches
  const input = document.createElement("input");
  input.type = "text"; input.className = "src-rename"; input.dataset.srcId = s.id;
  input.value = prefillValue !== undefined ? prefillValue : s.title;
  // Prevent clicks inside the input from propagating to row.onclick (showSource)
  input.onclick = e => e.stopPropagation();
  tt.replaceChildren(input, el("div","k", s.kind));
  input.focus(); input.select();
  let committed = false;
  const commit = async () => {
    if (committed) return; committed = true;
    const newTitle = input.value.trim();
    if (!newTitle || newTitle === s.title) { openNotebook(nb.id); return; }
    input.disabled = true;
    try {
      await api(`/api/sources/${s.id}`, {method:"PATCH", body:JSON.stringify({title:newTitle})});
      toast(t("src.rename.ok")); openNotebook(nb.id);
    } catch(e) { toast(e.message); openNotebook(nb.id); }
    finally { input.disabled = false; }
  };
  // relatedTarget check: if focus moves to another element within this row
  // (e.g. the delete or refresh button), skip blur-commit so the button click
  // fires normally on its own; the button's onclick rebuilds the DOM anyway.
  input.onblur = e => { if (row.contains(e.relatedTarget)) return; commit(); };
  input.onkeydown = e => {
    if (e.key==="Enter"){e.preventDefault();commit();}
    if (e.key==="Escape"){
      // Mark committed (so onblur's commit() below is a no-op) and blur
      // BEFORE reloading: renderNotebook()'s "preserve an in-progress
      // rename across an unrelated rebuild" logic keys off whether this
      // input is still document.activeElement, and since openNotebook()
      // is async, it would otherwise still be focused when the reload
      // completes — resurrecting the exact edit the user just cancelled
      // with the discarded text still in it.
      committed = true;
      input.blur();
      openNotebook(nb.id);
    }
  };
  return input;
}
function renderNotebook(){
  $("#nbTitle").textContent = cur ? `${t("app.title")} — ${cur.name}` : t("app.title");
  $("#srcAdders").hidden = !cur;
  const list = $("#srcList");
  // Preserve an in-progress, uncommitted rename edit across this rebuild (see
  // startSourceRename's comment for why this is needed).
  const activeRename = document.activeElement;
  let pendingRename = null;
  if (activeRename && activeRename.classList?.contains("src-rename") && list.contains(activeRename)) {
    pendingRename = {
      srcId: Number(activeRename.dataset.srcId),
      value: activeRename.value,
      selStart: activeRename.selectionStart,
      selEnd: activeRename.selectionEnd,
    };
    // Removing a focused element from the DOM fires a native blur event.
    // startSourceRename's onblur handler would treat that as the user
    // navigating away and auto-commit the (uncommitted) edit via PATCH —
    // firing right as this rebuild is about to restore the same edit,
    // racing its own restoration. Detach the old handlers first: this input
    // is being replaced by a fresh one below with fresh handlers regardless.
    activeRename.onblur = null;
    activeRename.onkeydown = null;
  } else if (externalPendingRename) {
    // A sibling control in the same row (e.g. the refresh button) was
    // clicked while a rename was in progress, moving focus off the input
    // before this rebuild ran -- document.activeElement can't see it, but
    // the click handler stashed it here. See externalPendingRename's own
    // comment and the refresh button's onclick handler.
    pendingRename = externalPendingRename;
  }
  externalPendingRename = null;  // consume: a stash is only ever restored once
  list.replaceChildren();
  srcIndex.clear();
  if (cur){
    cur.sources.forEach((s,i)=>{
      srcIndex.set(s.id, {s:i+1, title:s.title});
      const row = el("div","src");
      row.append(el("span","no",`S${i+1}`));
      const tt = el("span","t", s.title); tt.append(el("div","k", s.kind));
      // Inline title editing: double-click turns the span into an input
      tt.ondblclick = ev => { ev.stopPropagation(); startSourceRename(s, tt, row); };
      tt.setAttribute("title", t("src.rename"));
      row.append(tt);
      // Refresh button for URL sources
      if (s.origin && s.origin.startsWith("http")) {
        const ref = el("button","src-act","↻"); ref.setAttribute("aria-label", t("src.refresh"));
        ref.setAttribute("title", t("src.refresh"));
        ref.onclick = async ev => { ev.stopPropagation();
          // Clicking this button moves focus off any in-progress rename
          // input in the SAME row before openNotebook()'s rebuild runs, so
          // renderNotebook()'s document.activeElement-based preservation
          // never sees it -- unlike unrelated background rebuilds (note
          // add/delete, upload, ...), this one is triggered by a sibling
          // control the user just clicked, silently discarding whatever
          // they were mid-typing with no commit, no restore, no toast. The
          // source isn't going away (unlike the delete button, where
          // discarding a pending rename is correct since it'd be moot) --
          // stash the uncommitted value so renderNotebook() can restore it
          // after the refresh completes, same as it does for those other
          // rebuilds.
          const renameInput = tt.querySelector("input.src-rename");
          if (renameInput) {
            const v = renameInput.value.trim();
            if (v && v !== s.title) {
              externalPendingRename = {
                srcId: s.id, value: renameInput.value,
                selStart: renameInput.selectionStart, selEnd: renameInput.selectionEnd,
              };
            }
            // Detach handlers: this input is about to be torn down by the
            // rebuild below regardless: no stale commit()/blur() should
            // fire on it afterward.
            renameInput.onblur = null; renameInput.onkeydown = null;
          }
          ref.disabled = true; ref.textContent = "…";
          try { await api(`/api/sources/${s.id}/refresh`,{method:"POST"}); toast(t("src.refresh.ok")); openNotebook(cur.id); }
          catch(e){ toast(e.message); ref.disabled=false; ref.textContent="↻"; } };
        row.append(ref);
      }
      const del = el("button","src-act",null); del.textContent = "×"; del.setAttribute("aria-label",t("a11y.delsrc"));
      del.onclick = async ev=>{ ev.stopPropagation();
        del.disabled = true;
        try{ await api(`/api/sources/${s.id}`,{method:"DELETE"}); openNotebook(cur.id);}
        catch(e){ toast(e.message); del.disabled = false; } };
      row.append(del);
      row.onclick = () => { if (tt.querySelector("input.src-rename")) return; showSource(s.id, s.title); };
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      row.setAttribute("aria-label", t("a11y.viewsrc") + s.title);
      row.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showSource(s.id, s.title); } };
      list.append(row);
      // Restore an in-progress rename AFTER the row is attached to the live
      // DOM — input.focus() inside startSourceRename() is a no-op on a
      // detached element, so this must run after list.append(row) above.
      if (pendingRename && pendingRename.srcId === s.id) {
        const restored = startSourceRename(s, tt, row, pendingRename.value);
        restored.setSelectionRange(pendingRename.selStart, pendingRename.selEnd);
      }
    });
    $("#srcEmpty").hidden = (cur.sources?.length||0)>0;
    renderChatHistory(); renderStudio(); renderNotes(); refreshQuestions();
    $("#exMd").href = `/api/notebooks/${cur.id}/export?format=md`;
    $("#exBib").href = `/api/notebooks/${cur.id}/export?format=bibtex`;
    $("#exRis").href = `/api/notebooks/${cur.id}/export?format=ris`;
  } else {
    // No notebook selected: clear all dependent panes so deleted-notebook content
    // does not persist in the UI after the last notebook is removed.
    $("#srcEmpty").hidden = true;
    $("#chat").replaceChildren();
    $("#chatEmpty").hidden = false;
    $("#clearChat").hidden = true;
    $("#degBadge").hidden = true;
    $("#studioOut").replaceChildren();
    $("#noteList").replaceChildren();
    $("#qs").replaceChildren();
  }
}

/* ---------- citations: 蔵書印 chips ---------- */
function renderWithSeals(container, text, report){
  container.replaceChildren();
  // Match citation.py's NFKC-before-regex behavior: a JP-first local model
  // commonly emits full-width citation brackets/digits (［Ｓ１］), which the
  // backend already normalizes and verifies, but the ASCII-only \[ \] \d
  // regexes below would otherwise leave as dead, unstyled text.
  text = text.normalize("NFKC");
  const invalid = new Set((report && report.invalid) || []);
  const misattr = new Set((report && report.misattributed) || []);
  const confirmed = new Set((report && report.confirmed) || []);
  const srcMap = (report && report.source_map) || {};
  const idMap = (report && report.source_id_map) || null;
  const excerpts = (report && report.source_excerpts) || {};
  const contexts = (report && report.source_contexts) || {};
  // Match a whole bracket group, then pull every S-number inside it so that
  // combined citations like "[S1, S2]" render as two seals (matches backend).
  const reB = /\[([^\[\]]+)\]/g; let last = 0, m;
  while ((m = reB.exec(text))){
    const nums = [...m[1].matchAll(/[Ss]\s*(\d+)/g)].map(x => Number(x[1]));
    if (!nums.length) continue;           // not a citation bracket: leave as text
    if (m.index > last) container.append(document.createTextNode(text.slice(last, m.index)));
    nums.forEach((n, i) => {
      if (i) container.append(document.createTextNode(" "));
      const cls = invalid.has(n) ? " bad" : (misattr.has(n) ? " mis" : (confirmed.has(n) ? " ok" : ""));
      const chip = el("button","seal" + cls, `S${n}`);
      chip.type="button";
      const name = srcMap[`S${n}`] || "";
      const section = contexts[`S${n}`] || "";
      const nameSec = name + (section ? " › " + section : "");
      chip.title = invalid.has(n) ? t("chat.invalid")
        : misattr.has(n) ? t("chat.misattr") + (name ? " — " + nameSec : "")
        : confirmed.has(n) ? t("chat.confirmed") + (name ? " — " + nameSec : "")
        : nameSec;
      chip.setAttribute("aria-label", t("a11y.citation") + n + (name ? ": " + nameSec : ""));
      chip.onclick = () => openSeal(n, srcMap, idMap, excerpts, contexts);
      container.append(chip);
    });
    last = reB.lastIndex;
  }
  if (last < text.length) container.append(document.createTextNode(text.slice(last)));
}
function openSeal(n, srcMap, idMap, excerpts, contexts){
  // Prefer the authoritative source_id_map (avoids title collisions); fall back to title scan.
  const sid = idMap && idMap[`S${n}`];
  const title = srcMap[`S${n}`];
  const excerpt = (excerpts && excerpts[`S${n}`]) || null;
  const section = (contexts && contexts[`S${n}`]) || null;
  if (sid){ showSource(sid, title || `S${n}`, excerpt, section); return; }
  for (const [id, info] of srcIndex){ if (info.title === title){ showSource(id, title, excerpt, section); return; } }
  if (title) toast(title);
}
let _srcAbort = null, _viewerOpener = null;
function closeViewer(){
  $("#viewer").classList.remove("open");
  if (_viewerOpener) { _viewerOpener.focus(); _viewerOpener = null; }
}
async function showSource(id, title, excerpt, section){
  if (_srcAbort) _srcAbort.abort();
  _srcAbort = new AbortController();
  const sig = _srcAbort.signal;
  _viewerOpener = document.activeElement;
  $("#viewerTitle").textContent = title;
  const vt = $("#viewerText");
  vt.replaceChildren();
  // Section breadcrumb (v0.2.130): shows WHICH section of the source the cited
  // passage came from. Rendered above the excerpt when present; absent for old
  // persisted reports or sources with no heading structure.
  if (section){
    vt.append(el("div","section-label", t("viewer.section") + " " + section));
  }
  if (excerpt){
    // Show the retrieved passage immediately — no network round-trip needed.
    vt.append(el("div","excerpt-label", t("viewer.excerpt")));
    vt.append(el("div","excerpt", excerpt));
    // Lazy-load the full source text only when the user expands the details.
    const det = document.createElement("details"); det.className="full-src";
    const sum = document.createElement("summary"); sum.textContent = t("viewer.full_src");
    det.append(sum);
    det.addEventListener("toggle", async () => {
      if (!det.open || det.dataset.loaded) return;
      det.dataset.loaded = "1";
      const body = el("div","full-body", "…");
      det.append(body);
      try{
        const j = await (await api(`/api/sources/${id}/text`, {signal:sig})).json();
        if (sig.aborted) return;
        body.textContent = j.chunks.map(c=>c.text).join("\n\n⋯\n\n");
      }catch(e){ if (!sig.aborted) body.textContent = e.message; }
    });
    vt.append(det);
    $("#viewer").classList.add("open");
    $("#viewerClose").focus();
  } else {
    // No excerpt (old persisted message or Studio output): fetch immediately.
    try{
      const j = await (await api(`/api/sources/${id}/text`, {signal:sig})).json();
      if (sig.aborted) return;
      vt.textContent = j.chunks.map(c=>c.text).join("\n\n⋯\n\n");
      $("#viewer").classList.add("open");
      $("#viewerClose").focus();
    }catch(e){ if (!sig.aborted) toast(e.message); }
  }
}
$("#viewerClose").onclick = () => closeViewer();
$("#viewer").onclick = e => { if (e.target.id==="viewer") closeViewer(); };
// Focus trap: keep Tab/Shift-Tab within the dialog when open
$("#viewer").addEventListener("keydown", e=>{
  if (!$("#viewer").classList.contains("open")) return;
  if (e.key==="Escape"){ closeViewer(); return; }
  if (e.key!=="Tab") return;
  const focusable = Array.from($("#viewer").querySelectorAll(
    'button:not([disabled]),input:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'));
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length-1];
  if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

/* ---------- chat ---------- */
function addMsg(role, body, report){
  const wrap = el("div","msg "+role);
  wrap.append(el("div","who", role==="user" ? t("chat.you") : t("chat.shoin")));
  const bd = el("div","body");
  renderWithSeals(bd, body, report);
  wrap.append(bd);
  if (report && role!=="user"){
    const c = el("div","cites");
    if (report.degraded) c.append(el("span","badge dim", t("chat.degraded")));
    if (report.invalid && report.invalid.length){
      const b = el("span","badge err", `⚠ ${t("chat.invalid")}: ` + report.invalid.map(i=>"S"+i).join(", "));
      c.append(b);
    }
    if (report.misattributed && report.misattributed.length){
      c.append(el("span","badge err", `⚠ ${t("chat.misattr")}: ` + report.misattributed.map(i=>"S"+i).join(", ")));
    }
    if (report.confirmed && report.confirmed.length){
      c.append(el("span","badge dim", `✓ ${t("chat.confirmed")}: ` + report.confirmed.map(i=>"S"+i).join(", ")));
    }
    if (report.uncited && report.uncited.length){
      const b = el("span","badge warn", `⚠ ${t("chat.uncited")}: ${report.uncited.length}`);
      b.title = report.uncited.join("\n");
      c.append(b);
    }
    if (typeof report.coverage==="number" && report.cited && report.cited.length && report.coverage < COVERAGE_LOW){
      c.append(el("span","badge warn", t("chat.coverage.low")));
    }
    if (c.children.length) wrap.append(c);
  }
  $("#chat").append(wrap);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return bd;
}

$("#askForm").onsubmit = async e=>{
  e.preventDefault();
  if (!cur) return;
  const nbId = cur.id;
  const q = $("#askInput").value.trim(); if(!q) return;
  $("#askInput").value=""; $("#chatEmpty").hidden=true;
  addMsg("user", q, null);
  const bd = addMsg("ai", "", null);
  bd.append(el("span","spin", t("busy")));
  $("#askBtn").disabled = true;
  let acc = "", meta=null;
  try{
    const r = await jpost(`/api/notebooks/${nbId}/ask`, {question:q});
    const reader = r.body.getReader(); const dec = new TextDecoder();
    let buf = "";
    for(;;){
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0){
        const frame = buf.slice(0,i); buf = buf.slice(i+2);
        let ev="message", data="";
        for (const line of frame.split("\n")){
          if (line.startsWith("event:")) ev = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        let j; try{ j = JSON.parse(data); }catch(_e){ continue; }
        if (ev==="meta") meta = j;
        else if (ev==="delta"){ acc += j.text ?? ""; bd.textContent = acc; $("#chat").scrollTop = $("#chat").scrollHeight; }
        else if (ev==="done"){
          const rpt = j.report || {};
          renderWithSeals(bd, acc, rpt);
          const wrap = bd.parentElement, c = el("div","cites");
          if (rpt.degraded) c.append(el("span","badge dim", t("chat.degraded")));
          if (rpt.invalid?.length)
            c.append(el("span","badge err", `⚠ ${t("chat.invalid")}: `+rpt.invalid.map(x=>"S"+x).join(", ")));
          if (rpt.misattributed?.length)
            c.append(el("span","badge err", `⚠ ${t("chat.misattr")}: `+rpt.misattributed.map(x=>"S"+x).join(", ")));
          if (rpt.confirmed?.length)
            c.append(el("span","badge dim", `✓ ${t("chat.confirmed")}: `+rpt.confirmed.map(x=>"S"+x).join(", ")));
          if (rpt.uncited?.length){
            const ub = el("span","badge warn", `⚠ ${t("chat.uncited")}: ${rpt.uncited.length}`);
            ub.title = rpt.uncited.join("\n");
            c.append(ub);
          }
          if (rpt.cited?.length && rpt.coverage < COVERAGE_LOW)
            c.append(el("span","badge warn", t("chat.coverage.low")));
          if (c.children.length) wrap.append(c);
          $("#chat").scrollTop = $("#chat").scrollHeight;
        }
      }
    }
  }catch(err){ bd.textContent=""; toast(err.message); }
  finally{
    $("#askBtn").disabled = false;
    // If the stream closed before any delta/done event (e.g. server error after meta),
    // bd still holds the spinner — clear it so it doesn't linger permanently.
    if (!acc) bd.replaceChildren();
  }
};

/* ---------- studio & notes ---------- */
const KINDS = ["briefing","study_guide","faq","timeline","mindmap"];
function buildKindButtons(){
  const k = $("#kinds"); k.replaceChildren();
  KINDS.forEach(kind=>{
    const b = el("button","btn", t("studio."+kind)); b.type="button";
    b.onclick = async ()=>{
      if (!cur || !cur.sources?.length) return;
      b.disabled = true; const old=b.textContent; b.textContent=t("busy");
      try{ await jpost(`/api/notebooks/${cur.id}/studio`, {kind}); openNotebook(cur.id); }
      catch(e){ toast(e.message); }
      finally{ b.disabled=false; b.textContent=old; }
    };
    k.append(b);
  });
}
function renderStudio(){
  const out = $("#studioOut"); out.replaceChildren();
  const items = cur.studio||[];
  if (!items.length){
    const e0 = el("div","empty"); e0.append(el("b",null,t("studio.empty.title")), el("span",null,t("studio.empty.body")));
    out.append(e0); return;
  }
  items.forEach(o=>{
    const card = el("div","card");
    const h = el("h4",null,t("studio."+o.kind));
    if (o.report && o.report.invalid && o.report.invalid.length) h.append(el("span","badge err","⚠"));
    if (o.report && o.report.misattributed && o.report.misattributed.length) h.append(el("span","badge err", t("chat.misattr")));
    if (o.report && o.report.uncited && o.report.uncited.length){
      const ub = el("span","badge warn", `${t("chat.uncited")}: ${o.report.uncited.length}`);
      ub.title = o.report.uncited.join("\n");
      h.append(ub);
    }
    if (o.report && o.report.cited && o.report.cited.length && o.report.coverage < COVERAGE_LOW)
      h.append(el("span","badge warn", t("chat.coverage.low")));
    card.append(h);
    const bd = el("div","bd"); renderWithSeals(bd, o.body, o.report); card.append(bd);
    out.append(card);
  });
}
function renderNotes(){
  const out = $("#noteList"); out.replaceChildren();
  const items = cur.notes||[];
  if (!items.length){
    const e0 = el("div","empty"); e0.append(el("b",null,t("notes.empty.title")), el("span",null,t("notes.empty.body")));
    out.append(e0); return;
  }
  items.forEach(n=>{
    const card = el("div","card");
    const x = el("button","x","×"); x.setAttribute("aria-label",t("a11y.delnote"));
    x.onclick = async ()=>{ x.disabled = true; try{ await api(`/api/notes/${n.id}`,{method:"DELETE"}); openNotebook(cur.id);}catch(e){toast(e.message);} finally{ x.disabled = false; } };
    card.append(x, el("h4",null,n.title), el("div","bd",n.body));
    out.append(card);
  });
}
$("#noteForm").onsubmit = async e=>{
  e.preventDefault(); if(!cur) return;
  const nbId = cur.id;
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try{
    await jpost(`/api/notebooks/${nbId}/notes`, {title:$("#noteTitle").value, body:$("#noteBody").value});
    $("#noteTitle").value=""; $("#noteBody").value=""; openNotebook(nbId);
  }catch(err){ toast(err.message); }
  finally{ btn.disabled = false; }
};
$("#reindexBtn").onclick = async ()=>{
  if (!cur) return;
  const btn = $("#reindexBtn");
  btn.disabled = true; const old = btn.textContent; btn.textContent = t("busy");
  try{
    const j = await (await api(`/api/notebooks/${cur.id}/reindex`, {method:"POST"})).json();
    toast(t("reindex.ok").replace("{n}", j.n_embedded).replace("{total}", j.n_total));
  }catch(err){ toast(err.message); }
  finally{ btn.disabled = false; btn.textContent = old; }
};

/* ---------- adders ---------- */
$("#nbForm").onsubmit = async e=>{
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try{
    const j = await (await jpost("/api/notebooks", {name:$("#nbName").value})).json();
    $("#nbName").value=""; await openNotebook(j.id);
  }catch(err){ toast(err.message); }
  finally{ btn.disabled = false; }
};
$("#fileInput").onchange = async e=>{
  const f = e.target.files[0]; if(!f || !cur) return;
  const nbId = cur.id;
  e.target.disabled = true;
  try{
    await api(`/api/notebooks/${nbId}/upload`, {method:"POST",
      headers:{"X-Filename":encodeURIComponent(f.name),"Content-Type":"application/octet-stream"}, body:f});
    e.target.value=""; toast(t("sources.added")); openNotebook(nbId);
  }catch(err){ e.target.value=""; toast(err.message); }
  finally{ e.target.disabled = false; }
};
$("#urlBtn").onclick = async ()=>{
  const u = $("#urlInput").value.trim(); if(!u || !cur) return;
  const nbId = cur.id;
  const btn = $("#urlBtn");
  btn.disabled = true; const old = btn.textContent; btn.textContent = t("busy");
  try{ await jpost(`/api/notebooks/${nbId}/sources`, {target:u});
    $("#urlInput").value=""; toast(t("sources.added")); openNotebook(nbId);
  }catch(err){ toast(err.message); }
  finally{ btn.disabled = false; btn.textContent = old; }
};

/* ---------- tabs / lang / health ---------- */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected","false"));
    b.setAttribute("aria-selected","true");
    document.querySelectorAll(".pane").forEach(p=>p.classList.remove("active"));
    $("#"+b.dataset.pane).classList.add("active");
  };
});
$("#langBtn").onclick = ()=>{
  lang = lang==="ja" ? "en":"ja"; localStorage.setItem("shoin.lang", lang);
  applyI18n(); buildKindButtons(); if (cur) renderNotebook();
};
async function health(){
  try{
    const j = await (await api("/api/health")).json();
    const wasOn = !!window._llmOn;
    window._llmOn = !!j.llm;
    $("#lamp").classList.toggle("on", j.llm);
    $("#lampText").textContent = j.llm ? t("app.lamp.on") : t("app.lamp.off");
    const parts = [];
    if (j.model) parts.push(`LLM: ${j.model}`);
    if (j.embed_model) parts.push(`embed: ${j.embed_model}`);
    $("#lamp").title = parts.join(" / ");
    const b = $("#banner");
    b.style.display = j.llm ? "none" : "block";
    if (!j.llm) b.textContent = t("banner.offline");
    // Re-fetch questions when LLM goes from off→on (e.g. first health check
    // completes after notebook was already loaded, or LLM restarts).
    if (!wasOn && j.llm) refreshQuestions();
  }catch(_e){ window._llmOn=false; }
}

/* ---------- boot ---------- */
applyI18n(); buildKindButtons();
health(); setInterval(health, 20000);
loadNotebooks().catch(e=>toast(e.message));
</script>
