[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoin"
version = "0.2.51"
description = "Local, citation-verified NotebookLM alternative for lightweight LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pypdf>=4.0"]

[tool.setuptools.packages.find]
include = ["shoin*"]

[tool.setuptools.package-data]
shoin = ["static/*.html"]

[project.scripts]
shoin = "shoin.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
