[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoin"
version = "0.2.161"
description = "Local, citation-verified NotebookLM alternative for lightweight LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pypdf>=4.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Environment :: Web Environment",
    "Natural Language :: Japanese",
    "Natural Language :: English",
]

[tool.setuptools.packages.find]
include = ["shoin*"]

[tool.setuptools.package-data]
shoin = ["static/*.html"]

[project.scripts]
shoin = "shoin.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

# Pin the rule set explicitly. Without a `select`, ruff applies whatever its
# current release considers default, so the same source can pass on one machine
# and fail on another purely by ruff version — a non-deterministic gate is not a
# gate. These are ruff's documented defaults (pycodestyle errors + pyflakes),
# stated here so the contract is the project's, not the installed binary's.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
python_version = "3.11"
